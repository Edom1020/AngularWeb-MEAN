<div class="container mt-4">
  <p style="color: white">Total productos: {{ productos.length }}</p>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-success fw-bold">🚀 Nuestro Catálogo</h2>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-primary" routerLink="/listar-productos">⚙️ Gestión</button>
      <button class="btn btn-danger" (click)="cerrarSesion()">Cerrar Sesión</button>
    </div>
  </div>

  <div class="row row-cols-1 row-cols-md-3 g-4">
    <div class="col" *ngFor="let producto of productos">
      <div class="card h-100 shadow-sm border-0 product-card">
        <div class="image-container">
          <img
            [src]="producto.imagen || 'https://placehold.co/300x200?text=Sin+Imagen'"
            class="card-img-top"
            [alt]="producto.nombre"
          />
          <span class="badge bg-success price-tag">{{ producto.precio | currency }}</span>
        </div>
        <div class="card-body">
          <h5 class="card-title fw-bold">{{ producto.nombre }}</h5>
          <p class="card-text text-muted mb-1 small text-uppercase">{{ producto.categoria }}</p>
          <p class="card-text"><i class="bi bi-geo-alt"></i> {{ producto.ubicacion }}</p>
        </div>
        <div class="card-footer bg-transparent border-0 pb-3">
          <button class="btn btn-success w-100">Ver Detalles</button>
        </div>
      </div>
    </div>
  </div>
</div>
