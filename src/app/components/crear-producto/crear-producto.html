<!-- Diseño consistente con listar-productos -->
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="titulo-crear">Crear Producto</h2>
    <button class="btn btn-secondary" routerLink="/">← Volver</button>
  </div>

  <div class="row">
    <div class="col-lg-6 offset-lg-3">
      <div class="card shadow rounded-3">
        <div class="card-body p-4">
          <form class="mt-3" [formGroup]="productoForm" (ngSubmit)="agregarProducto()">
            <div class="mb-3">
              <label for="nombre" class="form-label fw-bold">Nombre del Producto</label>
              <input
                type="text"
                class="form-control form-control-lg"
                id="nombre"
                placeholder="Ej: Laptop HP"
                formControlName="producto"
              />
              <div
                class="text-danger"
                *ngIf="
                  productoForm.get('producto')?.invalid && productoForm.get('producto')?.touched
                "
              >
                Debes llenar este campo
              </div>
            </div>

            <div class="mb-3">
              <label for="categoria" class="form-label fw-bold">Categoría</label>
              <select
                class="form-control form-control-lg"
                id="categoria"
                formControlName="categoria"
              >
                <option value="">-- Selecciona una categoría --</option>
                <option value="Smartphones">Smartphones</option>
                <option value="Laptops">Laptops</option>
                <option value="Tablets">Tablets</option>
                <option value="Accesorios">Accesorios</option>
                <option value="Computadores de Escritorio">Computadores de Escritorio</option>
                <option value="Audio">Audio</option>
                <option value="Televisores">Televisores</option>
                <option value="Cámaras">Cámaras</option>
                <option value="Wearables">Wearables</option>
                <option value="Otro">Otro</option>
              </select>
              <div
                class="text-danger"
                *ngIf="
                  productoForm.get('categoria')?.invalid && productoForm.get('categoria')?.touched
                "
              >
                Debes seleccionar una categoría
              </div>
            </div>

            <div class="mb-3">
              <label for="ubicacion" class="form-label fw-bold">Ubicación</label>
              <input
                type="text"
                class="form-control form-control-lg"
                id="ubicacion"
                placeholder="Ej: Colombia"
                formControlName="ubicacion"
              />
              <div
                class="text-danger"
                *ngIf="
                  productoForm.get('ubicacion')?.invalid && productoForm.get('ubicacion')?.touched
                "
              >
                Debes llenar este campo
              </div>
            </div>

            <div class="mb-4">
              <label for="precio" class="form-label fw-bold">Precio</label>
              <input
                type="number"
                class="form-control form-control-lg"
                id="precio"
                placeholder="Ej: 2.500.000"
                step="0.01"
                formControlName="precio"
              />
              <div
                class="text-danger"
                *ngIf="productoForm.get('precio')?.invalid && productoForm.get('precio')?.touched"
              >
                Debes llenar este campo
              </div>
            </div>

            <div class="d-flex gap-2">
              <button
                type="submit"
                [disabled]="productoForm.invalid"
                class="btn btn-success btn-lg flex-grow-1"
              >
                Guardar Producto
              </button>
              <button type="reset" class="btn btn-warning btn-lg">
                <img src="/images/brush.png" alt="Limpiar" class="img-fluid" />
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
